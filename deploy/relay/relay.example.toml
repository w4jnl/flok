# flok-relay configuration (flok-relay serve -config relay.toml). Every value can also come from
# the environment (FLOK_RELAY_LISTEN, FLOK_RELAY_DATA_DIR, FLOK_RELAY_ADMIN_TOKENS,
# FLOK_RELAY_INSTANCE_TOKENS, FLOK_RELAY_DEVICE_TOKENS, FLOK_RELAY_APNS_KEY_FILE / _KEY_ID /
# _TEAM_ID / _TOPIC, FLOK_RELAY_TUNNEL_ONLY), which wins over the file. Tokens: `flok-relay token`.
listen = ":8080"              # plain HTTP; TLS and the public name belong to the reverse proxy
data_dir = "/data"            # devices.json (the phones registered for pushes), phones.json (the phones
                              # paired, with their keys hashed), instances.json (the floks that joined by
                              # code, keys hashed), tenants.json and link-key.pem (the relay's key for
                              # encrypted links; flok-relay pin prints its pin)
admin_tokens = []             # the flok(s) you manage the relay from link with one ([link] token) and
                              # let other floks in (flok tenant …); they are instance tokens too
instance_tokens = []          # optional: static tokens for floks that do not join by code ([link] token)
device_tokens = []            # optional: static keys for curl and scripts; phones pair with flok phone pair
tunnel_only = false           # true: refuse links without [link] pin (plain /link), once all have it

[apns]                        # pushes; leave key_file empty to run without
key_file = ""                 # the .p8 from the developer account (Keys, Apple Push Notifications service)
key_id = ""                   # its 10-character id
team_id = ""                  # the team id
topic = ""                    # the app's bundle id
# No sandbox switch: each phone says whether its token is a sandbox one (a build from Xcode) or
# a production one (TestFlight, App Store), and the relay pushes through that service.
