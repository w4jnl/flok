<!doctype html>
<!-- assets/brand/render-hero.sh renders this to flok-hero.png (1280x320) with headless Chrome.
     The lockup is flok-lockup-tagline.svg inline, so the page's web font applies to its text. -->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:320px;overflow:hidden;background:#14181A;color:#F2F5F5}
  .bar{position:absolute;left:0;top:0;width:6px;height:320px;background:#3FD0D4}
  /* the lockup draws mark and wordmark in currentColor; the banner wants the teal mark of the
     icons next to a white wordmark, and a quieter tagline than the small lockup carries */
  .lockup{position:absolute;left:72px;top:77px;width:832px;height:166px;color:#3FD0D4}
  .lockup text:first-of-type{fill:#F2F5F5}
  .lockup text:nth-of-type(2){font-size:6.4px}
</style></head><body><div class="bar"></div><div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="832" height="166">
<title>flok — lockup with tagline</title>
<g transform="translate(0 4) scale(1.83333)">
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8 3.2 H6 a2.2 2.2 0 0 0 -2.2 2.2 V18.6 a2.2 2.2 0 0 0 2.2 2.2 H8"></path>
    <path d="M16 3.2 H18 a2.2 2.2 0 0 1 2.2 2.2 V18.6 a2.2 2.2 0 0 1 -2.2 2.2 H16"></path>
  </g>
  <path d="M7.3 12.5 L12 8.0 L16.7 12.5" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  <rect x="9.6" y="16.2" width="4.8" height="2.2" rx="1.1" fill="currentColor"></rect>
</g>
  <text x="56" y="30" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" font-size="28" letter-spacing="-1" fill="currentColor">flok</text>
  <text x="57" y="46" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8A999C">agent sidebar for tmux</text>
</svg></div></body></html>
