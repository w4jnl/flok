name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./assets)" || { gofmt -l ./cmd ./internal ./assets; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: ./bin/flok version
      - name: flok-bar version (macOS only)
        if: runner.os == 'macOS'
        run: ./bin/flok-bar version

  e2e:
    name: e2e (${{ matrix.os }}, isolated tmux servers)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - run: tmux -V
      - name: run suites
        run: |
          set -e
          for s in scripts/e2e/m*.sh; do
            echo "== $s"
            "$s"
          done
