name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# one run per branch: a new push to a pull request cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./assets)" || { gofmt -l ./cmd ./internal ./assets; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: ./bin/flok version
      - name: flok-bar version (macOS only)
        if: runner.os == 'macOS'
        run: ./bin/flok-bar version

  e2e:
    name: e2e (${{ matrix.os }}, isolated tmux servers)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - run: tmux -V
      - name: run suites (every one, in order, each under a watchdog; the table lands in the step summary)
        env:
          FLOK_DEBUG: "1"
        run: scripts/e2e/run-all.sh
      - name: keep the logs of the suites that did not pass
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.os }}
          path: /tmp/flok-e2e-logs
          if-no-files-found: ignore

  # The tmux versions RHEL ships: Rocky 8 = 2.7 (flok's floor, degraded mode), Rocky 9 = 3.2a.
  # tar/gzip/git go in first because checkout and setup-go need them inside the container.
  e2e-el:
    name: e2e (${{ matrix.name }}, tmux ${{ matrix.tmux }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rocky8, image: "rockylinux:8", tmux: "2.7" }
          - { name: rocky9, image: "rockylinux:9", tmux: "3.2a" }
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    timeout-minutes: 25
    steps:
      - name: packages
        run: dnf -y install tmux python3 git tar gzip procps-ng ncurses-term glibc-langpack-en && tmux -V
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: run suites (every one, in order, each under a watchdog; the table lands in the step summary)
        env:
          FLOK_DEBUG: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/e2e/run-all.sh
      - name: keep the logs of the suites that did not pass
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.name }}
          path: /tmp/flok-e2e-logs
          if-no-files-found: ignore
