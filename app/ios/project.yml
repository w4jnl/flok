# flok for iPhone: the Xcode project is generated from this file (brew install xcodegen;
# make ios-project). Signing comes from Local.xcconfig (gitignored): FLOK_TEAM_ID = your team id.
name: Flok
options:
  bundleIdPrefix: nl.w4j
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(FLOK_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Flok:
    type: application
    platform: iOS
    sources:
      - path: Flok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    info:
      path: Flok/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Flok/Flok.entitlements
      properties:
        aps-environment: development
  FlokTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlokTests
    dependencies:
      - target: Flok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.tests
schemes:
  Flok:
    build:
      targets:
        Flok: all
        FlokTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FlokTests]
    archive:
      config: Release
