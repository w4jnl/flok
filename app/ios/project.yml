# flok for iPhone: the Xcode project is generated from this file (brew install xcodegen;
# make ios-project). Local.xcconfig (gitignored) holds what is yours: FLOK_TEAM_ID = your team
# id, and FLOK_ENTITLEMENTS = Flok/Flok.entitlements (pushes, time-sensitive alerts and the
# keychain group shared with the content extension and the widget, which also carries the
# privacy flag; a free Apple ID's personal team cannot sign that: leave it empty there).
# Shared/ is compiled into the app and its notification extensions:
# FlokNotificationService puts the state tile on a push, FlokNotificationContent is the expanded
# view with the live screen and the answer keys, FlokWidgets is the Live Activity (Dynamic
# Island, Lock Screen).
name: Flok
options:
  bundleIdPrefix: nl.w4j
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(FLOK_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Flok:
    type: application
    platform: iOS
    sources:
      - path: Flok
      - path: Shared
    dependencies:
      - target: FlokNotificationService
      - target: FlokNotificationContent
      - target: FlokWidgets
      - target: FlokShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_ENTITLEMENTS: $(FLOK_ENTITLEMENTS)
    info:
      path: Flok/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        # hold to talk (the microphone; Apple's recogniser before iOS 26 asks for speech
        # recognition as well), and a photo for an agent
        NSMicrophoneUsageDescription: Hold the microphone to dictate a reply to an agent; the words are recognised on this phone.
        NSSpeechRecognitionUsageDescription: On an iPhone before iOS 26 the dictation uses Apple's speech recognition service.
        NSCameraUsageDescription: Take a photo for an agent, or scan the code that pairs this phone with your relay.
        # the app lock (Settings › Privacy)
        NSFaceIDUsageDescription: Unlock flok on this phone.
        CFBundleURLTypes:
          - CFBundleURLName: nl.w4j.flok
            CFBundleURLSchemes: [flok]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  FlokNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: FlokNotificationService
      - path: Shared/PushPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FlokNotificationService/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  FlokNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: FlokNotificationContent
      - path: Shared
    dependencies: # linked by hand: the extension's context class lives in UserNotificationsUI, and
      # without the link iOS cannot load the card (it crashes and shows the plain notification)
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.NotificationContent
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FlokNotificationContent/FlokNotificationContent.entitlements
    info:
      path: FlokNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [FLOK_PERMISSION, FLOK_QUESTION, FLOK_DONE]
            UNNotificationExtensionInitialContentSizeRatio: 0.9
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
  FlokShare: # the share sheet's "flok": a screenshot, a photo, a PDF, text or a link to an agent
    type: app-extension
    platform: iOS
    sources:
      - path: FlokShare
      - path: Shared/RelayAPI.swift
      - path: Shared/RelayURL.swift
      - path: Shared/Keychain.swift
      - path: Shared/Wire.swift
      - path: Shared/Attach.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FlokShare/FlokShare.entitlements
    info:
      path: FlokShare/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsFileWithMaxCount: 6
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  FlokWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FlokWidgets
      - path: Shared/FlokActivity.swift
      - path: Shared/LiveViews.swift
      - path: Shared/Brand.swift
      - path: Shared/Privacy.swift
      - path: Shared/Keychain.swift
      - path: Shared/Fonts
      - path: Shared/Images
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FlokWidgets/FlokWidgets.entitlements
    info:
      path: FlokWidgets/Info.plist
      properties:
        CFBundleDisplayName: flok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [JetBrainsMono-Regular.ttf, JetBrainsMono-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FlokTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlokTests
    dependencies:
      - target: Flok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.tests
  FlokScreens:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FlokScreens
    dependencies:
      - target: Flok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.flok.screens
        TEST_TARGET_NAME: Flok
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlokScreens: # the README's phone screenshots (assets/demo/phone.sh), apart from make ios-test
    build:
      targets:
        FlokScreens: [test]
    test:
      config: Debug
      targets: [FlokScreens]
  Flok:
    build:
      targets:
        Flok: all
        FlokTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FlokTests]
    archive:
      config: Release
